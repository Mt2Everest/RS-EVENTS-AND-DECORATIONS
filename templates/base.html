<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Display the current page title -->
    <title>
        {% block title %}
        RS Events & Decorations
        {% endblock %}
    </title>

    <!-- Connect the website stylesheet -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- ==========================
         WEBSITE NAVIGATION
    ========================== -->

    <nav>

        <a href="{{ url_for('home') }}">Home</a>

        <a href="{{ url_for('services') }}">Services</a>

        <a href="{{ url_for('gallery') }}">Gallery</a>

        <a href="{{ url_for('about') }}">About Us</a>

        <a href="{{ url_for('contact') }}">Contact</a>

        <a href="{{ url_for('assistant') }}">AI Assistant</a>


        <!-- Display account pages after login -->
        {% if session.get("logged_in") %}

            <a href="{{ url_for('dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('in_progress') }}">
                In Progress
            </a>

            <a href="{{ url_for('inventory') }}">
                Inventory
            </a>


            <!-- Only Rani can access management pages -->
            {% if session.get("role") == "admin" %}

                <a href="{{ url_for('archive') }}">
                    Archive
                </a>

                <a href="{{ url_for('recently_deleted') }}">
                    Recently Deleted
                </a>

                <a href="{{ url_for('manage_employees') }}">
                    Employees
                </a>

            {% endif %}

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        {% else %}

            <a href="{{ url_for('login') }}">
                Staff Login
            </a>

        {% endif %}

    </nav>


    <!-- ==========================
         PAGE CONTENT
    ========================== -->

    <main>

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
